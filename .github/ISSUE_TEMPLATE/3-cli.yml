name: 💻 CLI Bug
description: Report an issue in the Codex CLI
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a bug report! It helps make Kay better for everyone.

        If you need help or support using Kay, and are not reporting a bug, please post on [kay/discussions](https://github.com/alo-labs/kay/discussions), where you can ask questions or engage with others on ideas for how to improve Kay.

        Make sure you are running the [latest](https://npmjs.com/package/@alo-labs/kay) version of the Kay CLI. The bug you are experiencing may already have been fixed.

  - type: input
    id: version
    attributes:
      label: What version of Kay is running?
      description: Copy the output of `kay --version` (or `code --version` for compatibility installs)
  - type: input
    id: model
    attributes:
      label: Which model were you using?
      description: Like `gpt-5`, `o3`, etc.
  - type: input
    id: platform
    attributes:
      label: What platform is your computer?
      description: |
        For macOS and Linux: copy the output of `uname -mprs`
        For Windows: copy the output of `"$([Environment]::OSVersion | ForEach-Object VersionString) $(if ([Environment]::Is64BitOperatingSystem) { "x64" } else { "x86" })"` in the PowerShell console
  - type: input
    id: terminal
    attributes:
      label: What terminal emulator and version are you using (if applicable)?
      description: |
        Also note any multiplexer in use (screen / tmux / zellij).
        E.g., VS Code, Terminal.app, iTerm2, Ghostty, Windows Terminal (WSL / PowerShell)
  - type: textarea
    id: steps
    attributes:
      label: What steps can reproduce the bug?
      description: Explain the bug and provide a code snippet that can reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What is the expected behavior?
      description: If possible, please provide text instead of a screenshot.
  - type: textarea
    id: actual
    attributes:
      label: What do you see instead?
      description: If possible, please provide text instead of a screenshot.
  - type: textarea
    id: notes
    attributes:
      label: Additional information
      description: Is there anything else you think we should know?
