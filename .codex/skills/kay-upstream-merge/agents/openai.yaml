interface:
  display_name: "Kay Upstream Merge"
  short_description: "List Kay upstream changes; merge only on explicit request"
  default_prompt: "Use $kay-upstream-merge to read the strategy doc, inspect git state, and list unmerged Every Code and OSS changes before changing merge state. Do not rebase. Keep `kay-rs/` as the active workspace and treat `codex-rs/` as a read-only OSS mirror unless the task explicitly refreshes it. If the invocation is implicit, ambiguous, or the user did not explicitly ask to merge, only list/report status using local refs or side-effect-free `git ls-remote`, stop after the listing, and do not run `git fetch`, create refs, create branches, switch branches, or merge state. Only when the user explicitly asks to merge, fetch first, pin the fetched refs used for the listing, list before merge-state changes, and stop on blockers (dirty worktree, missing remotes, local `main` behind `origin/main`, current non-`main` branch missing the updated local `main`, stale `codex-rs`, unavailable gates/credentials, high-risk upstream changes whose Kay preservation strategy is unclear); record stale-main blockers in the listing and do not auto-merge `origin/main` before listing. Then merge only the exact Every Code SHA that was pinned and shown in the listing, create a local safety ref before any merge, create a work branch unless the user explicitly requested direct `main` work, merge that pinned Every Code SHA first, preserve Kay-only behavior, and record the audit log. After the Every Code merge is stable and `./build-fast.sh` plus `bash scripts/upstream-merge/verify.sh` are clean, run the separate OSS Codex review/port pass. Pin the refreshed OSS SHA as `oss_under_review` and use it for OSS listing, provenance, classification, and selective porting; for a full OSS merge pin `oss_to_merge` from that SHA and never merge moving `oss/main` directly. Use the same pinned Every Code SHA from the merge for OSS coverage classification, recover it from the Every Code merge commit or audit log and canonicalize it as `merged_every_code` on resume, assert it is reachable from Kay HEAD and Every Code, and if `upstream/main` moves after the merge, stop or merge the newer Every Code first rather than treating the newer ref as already covered; prove `codex-rs` tree provenance against the OSS commit or use a temporary OSS checkout. Before declaring ready for any code/build/script/packaging/workflow/dependency/generated-artifact upstream merge, run `git diff --check`, `bash scripts/check-kay-path-deps.sh`, `bash scripts/upstream-merge/diff-crates.sh --all`, `bash scripts/upstream-merge/verify.sh`, `./build-fast.sh`, and `./pre-release.sh`. If TypeScript SDK paths or generated protocol bindings changed, also run `pnpm --dir sdk/typescript test`. If provider/model behavior changed, also run `bash scripts/pre-release-live-provider-gate.sh` for OpenCode Go MiMo V2.5, MiMo V2.5 Pro, DeepSeek V4 Flash with max reasoning, and MiniMax M2.7, excluding direct MiniMax.io provider tests. Never push or release if any required gate fails, any warning remains, or required live-provider credentials are unavailable."

policy:
  allow_implicit_invocation: true
